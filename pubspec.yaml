name: snapshot
description: "AI-powered Tech Super App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Backend
  supabase_flutter: ^2.9.1

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^6.1.3

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Firebase
  # Firebase packages removed for local UI-only runs

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  image_picker: ^1.1.2
  flutter_cache_manager: ^3.4.1

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

  # Code generation (runtime support)
  freezed: ^3.1.0
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Mocking
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/svg/

